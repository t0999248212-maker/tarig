<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="blog" class="page">
        <section class="blog-page">
            <header class="blog-intro">
                <h1>Welcome Back<br>Blog Club</h1>
            </header>

            <div class="blog-grid">
                <article class="blog-card">
                    <img class="blog-image" src="Screenshot from 2026-09-25 18-05-05.png" alt="Workspace setup with UI/UX design materials">
                    <div class="blog-card-copy">
                        <h2>Learning UI/UX</h2>
                        <p>Learning how to create simple and user-friendly designs.</p>
                        <a href="index.html#home">Read More</a>
                    </div>
                </article>

                <article class="blog-card">
                    <img class="blog-image" src="Screenshot from 2026-09-25 17-57-21.png" alt="Dark dashboard and Figma project design workspace">
                    <div class="blog-card-copy">
                        <h2>My Figma Journey</h2>
                        <p>My journey of learning Figma and creating new designs.</p>
                        <a href="index.html#home">Read More</a>
                    </div>
                </article>
            </div>

            <div class="portfolio-band" aria-label="Portfolio examples">
                <div class="portfolio-gallery">
                    <img src="Pasted image.png" alt="Creative poster layout with design elements">
                    <img src="WhatsApp Image 2026-09-11 at 2.14.00 PM.jpeg" alt="Poster-style design with soft color palette and branding notes">
                </div>
            </div>

            <div class="portfolio-caption">
                <h2>My Design Work</h2>
                <p>Creating simple and creative designs using Figma.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
